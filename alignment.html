<!DOCTYPE html>
<html> <!-- This is a comment-->
    <head>
        <title>Alignment</title>
        <meta charset="UTF-8">
        <style>
            button{
                padding:20px;
                margin:8px;
                margin-left:50px;
            }
            #box, #boxTwo{
                width: 75px;
                height: 75px;
                background-color: blue;
                color:white;
                text-align: center;
                margin: 0 auto;
            }
            #box-wrapper{
                display: grid;
                grid-template-columns: 1fr 200px 1fr;
                gap:5px;
            }
            #flex-wrapper{
                display: none;
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                flex-wrap: wrap;
            }
            #parrot{
                width:50px
            }
        </style>
    </head>
    <body>
        <h1>Alignment Notes</h1>
        <div id="box-wrapper">
            <div id="box" onmouseover="dissapear()"
            onmouseout="appear()">
                <p>Box 1</p>
            </div>
            <div id="boxTwo">
                <p>Box 2</p>
            </div>
            <div id="box">
                <p>Box 3</p>
            </div>
            <div id="box">
                <p>Box 4</p>
            </div>
        </div>
        <div id="flex-wrapper">
            <div id="box">
                <p>Box 1</p>
            </div>
            <div id="box">
                <p>Box 2</p>
            </div>
            <div id="box">
                <p>Box 3</p>
            </div>
            <div id="box">
                <p>Box 4</p>
            </div>
        </div>
        <input type="color" id="colorPicker">
        <br>
        <button onClick="color()">Click Me</button>
        <button id="showMore" onClick="show()">Show More</button>
        <script>
            function color(){
                let newColor = document.getElementById("colorPicker").value
                document.getElementById("box").style.backgroundColor = newColor
            }
            function dissapear(){
                document.getElementById("boxTwo").style.display = "none"
            }
            function appear(){
                document.getElementById("boxTwo").style.display = "block"
            }
            function show(){
                let element = document.getElementById("flex-wrapper")
                if (element.style.display == "flex"){
                    element.style.display = "none"
                    document.getElementById("showMore").innerHTML = "Show More"
                }else{
                    element.style.display = "flex"
                    document.getElementById("showMore").interHTML = "Show Less"
                }
            }
            let images= ["https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR83RwHQUSBXCMNLkyBiAXyAy7rfh9XTjAd6aKvttPuTA&s=10 ", "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQR8Lf_XMIGZBtayJpJNPFmmCALIgEqjfv2qj3bedJAQw&s=10 ", "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR2UgeGaO2d9zSC1UD23pa_fHucCu0fBQZ4bFHT_ArNzg&s=10" , "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRrbF9vynsFUyrvJ0rk-e3nn7AOUJbfY6nbTLGcLh9_jw&s=10", "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTOJ4IZbkwwyJD4dq7MObC7x1gpYN0xVkTOV_X9T9ZCMQ&s=10"]
            let current = 0
            function changeImage(){
                current+= 1
                if (current > 4){
                    current = 0
                }
                document.getElementById("parrot").src = images[current]
            }
        </script>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTOJ4IZbkwwyJD4dq7MObC7x1gpYN0xVkTOV_X9T9ZCMQ&s=10" alt="Parrot" id="parrot" onmouseout="changeImage()">
    </body>
</html>
